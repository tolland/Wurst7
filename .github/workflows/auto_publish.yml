name: Auto Publish Development Builds
run-name: "Auto-publish ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    branches:
      - '1.21.8-develop'  # Trunk branch
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '1.21.8-develop'

permissions:
  contents: write  # Needed to create releases
  pull-requests: write  # Needed to comment on PRs

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "microsoft"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        build-scan-publish: true
        build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
        build-scan-terms-of-use-agree: "yes"

    - name: Determine version suffix
      id: version
      run: |
        BASE_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2 | tr -d ' \r')
        SHORT_SHA=$(git rev-parse --short HEAD)

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # PR build: v7.51.2-MC1.21.8-pr123-abc1234
          PR_NUMBER=${{ github.event.pull_request.number }}
          VERSION="${BASE_VERSION}-pr${PR_NUMBER}-${SHORT_SHA}"
          RELEASE_NAME="PR #${PR_NUMBER} - ${SHORT_SHA}"
          IS_PRERELEASE="true"
        else
          # Trunk build: v7.51.2-MC1.21.8-develop-abc1234
          VERSION="${BASE_VERSION}-develop-${SHORT_SHA}"
          RELEASE_NAME="Development Build - ${SHORT_SHA}"
          IS_PRERELEASE="true"
        fi

        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
        echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
        echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

        echo "### Version Info" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Version**: \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Release Name**: ${RELEASE_NAME}" >> "$GITHUB_STEP_SUMMARY"

    - name: Update version in gradle.properties
      run: |
        sed -i "s/^mod_version=.*/mod_version=${{ steps.version.outputs.version }}/" gradle.properties

    - name: Build
      run: ./gradlew build --stacktrace --warning-mode=fail

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: ${{ steps.version.outputs.release_name }}
        draft: false
        prerelease: ${{ steps.version.outputs.is_prerelease }}
        files: |
          build/libs/*-[0-9]*.jar
          build/libs/*-sources.jar
        body: |
          # ${{ steps.version.outputs.release_name }}

          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.ref_name }}
          ${{ github.event_name == 'pull_request' && format('**PR**: #{0} - {1}', github.event.pull_request.number, github.event.pull_request.title) || '' }}

          ---

          ### Installation

          This is an automated development build. To use it in your project:

          #### Using Gradle (Ivy resolver)

          Add to your `build.gradle`:

          ```gradle
          repositories {
              ivy {
                  url 'https://github.com/tolland/Wurst7/releases/download'
                  patternLayout {
                      artifact '[revision]/[module]-[revision](-[classifier]).[ext]'
                  }
                  metadataSources {
                      artifact()
                  }
              }
          }

          dependencies {
              modImplementation 'net.wurstclient:Wurst-Client:${{ steps.version.outputs.version }}'
          }
          ```

          #### Direct Download

          Download the JAR file from the assets below.

          ---

          <sub>This is a development build and may contain bugs. Use at your own risk.</sub>

    - name: Comment on PR (if PR build)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const version = '${{ steps.version.outputs.version }}';
          const releaseUrl = '${{ steps.create_release.outputs.url }}';

          const comment = `## 🚀 Development Build Published

          A development build has been published for this PR!

          **Version**: \`${version}\`
          **Release**: [${releaseUrl}](${releaseUrl})

          ### Installation

          Add to your \`build.gradle\`:

          \`\`\`gradle
          repositories {
              ivy {
                  url 'https://github.com/tolland/Wurst7/releases/download'
                  patternLayout {
                      artifact '[revision]/[module]-[revision](-[classifier]).[ext]'
                  }
                  metadataSources {
                      artifact()
                  }
              }
          }

          dependencies {
              modImplementation 'net.wurstclient:Wurst-Client:${version}'
          }
          \`\`\`

          <sub>This build will be available until the PR is closed.</sub>`;

          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
