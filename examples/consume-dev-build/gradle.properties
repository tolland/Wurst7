# Example gradle.properties for consuming Wurst development builds
# Copy this to your project and customize as needed

# Minecraft and Fabric
minecraft_version=1.21.8
loader_version=0.18.1
fabric_version=0.136.1+1.21.8

# Your mod info
mod_version=1.0.0
maven_group=com.example
archives_base_name=example-mod

# Wurst development build version
# Get the latest version from: https://github.com/tolland/Wurst7/releases
#
# Trunk builds: v7.51.2-MC1.21.8-develop-<short-sha>
# PR builds: v7.51.2-MC1.21.8-pr<number>-<short-sha>
#
# Examples:
# wurst_version=v7.51.2-MC1.21.8-develop-abc1234
# wurst_version=v7.51.2-MC1.21.8-pr42-xyz5678
#
wurst_version=v7.51.2-MC1.21.8-develop-abc1234
